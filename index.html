    const parent = node.parentElement;
    return !parent || !!parent.closest('script, style, textarea, input, pre, code, #outputText, #inspectBefore, #inspectAfter, #headerEmail, #settingsEmail, #questionsList, [data-user-content]');

  function translatePage() {
    const lookup = currentLanguage === 'ar' ? textTranslations : reverseTranslations;
    document.documentElement.lang = currentLanguage;
    document.documentElement.dir = currentLanguage === 'ar' ? 'rtl' : 'ltr';
    const pageTitle = currentLanguage === 'ar' ? 'MiniMiz — تحسين دقيق للبرومبتات' : 'MiniMiz — precision prompt optimization';
    if (document.title !== pageTitle) document.title = pageTitle;

    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      if (shouldSkipTranslation(node)) continue;
      const value = node.nodeValue;
      const trimmed = value.trim();
      const translated = lookup[trimmed];
      if (translated && translated !== trimmed) node.nodeValue = value.replace(trimmed, translated);
    }

    document.querySelectorAll('[placeholder], [aria-label], [title]').forEach((element) => {
      ['placeholder', 'aria-label', 'title'].forEach((attribute) => {
        const value = element.getAttribute(attribute);
        if (!value) return;
        const translated = lookup[value];
        if (translated && translated !== value) element.setAttribute(attribute, translated);
      });
    });

    const nextLanguage = currentLanguage === 'ar' ? 'English' : 'العربية';
    const ariaLabel = currentLanguage === 'ar' ? 'Switch to English' : 'Switch to Arabic';
    ['languageToggleApp'].forEach((id) => {
      const button = document.getElementById(id);
      if (!button) return;
      if (button.textContent !== nextLanguage) button.textContent = nextLanguage;
      const translatedAriaLabel = translateLabel(ariaLabel);
      if (button.getAttribute('aria-label') !== translatedAriaLabel) button.setAttribute('aria-label', translatedAriaLabel);
    });
  }

  async function callAPI(payload, method = 'POST', endpoint = cfg.worker) {
    if (!cfg.worker) throw new Error('NO_WORKER_CONFIGURED');
    const { data: { session } } = await supa.auth.getSession();
    let token = session && session.access_token;
    if (!token) throw new Error('NOT_SIGNED_IN');
    const readResponse = async (response) => {
      let data = {};
      try { data = await response.json(); } catch {}
      if (data.usage) renderUsageMeter(data.usage);
      if (!response.ok) {
        const error = new Error(data.error || ('API ' + response.status));
        error.status = response.status;
        error.usage = data.usage;
        throw error;
      }
      return data;
    };
    const sendToEndpoint = (accessToken) => fetch(endpoint, {
      method,
      headers: { ...(method === 'POST' ? { 'Content-Type': 'application/json' } : {}), 'Authorization': 'Bearer ' + accessToken },
      ...(method === 'POST' ? { body: JSON.stringify(payload) } : {}),
    });
    let res = await sendToEndpoint(token);
    if (res.status === 401) {
      // Refresh an expired access token once; an API auth error must never sign the user out.
      const { data, error } = await supa.auth.refreshSession();
      token = data && data.session && data.session.access_token;
      if (error || !token) throw new Error('API_AUTH_REJECTED');
      res = await sendToEndpoint(token);
      if (res.status === 401) throw new Error('API_AUTH_REJECTED');
    }
    return readResponse(res);
  }

  async function runOptimize(prompt, answers) {
    const requestId = ++optimizationRequestId;
    setLoading(true);
    try {
      const data = await callAPI({ prompt, questionnaireAnswers: answers, archetype, mode, operationMode });
      if (requestId !== optimizationRequestId) return;
      if (data.action === 'QUESTIONNAIRE' && Array.isArray(data.questions) && data.questions.length) {
        renderQuestionnaire(data.questions);
      } else if (data.action === 'NO_COMPRESSION_NEEDED') {
        renderOutput(data, prompt);
        toast(currentLanguage === 'ar'

          : 'This prompt is already concise; shortening it further could change its meaning.');
      } else {
        const stats = renderOutput(data, prompt);
        await autoSave(prompt, data.optimized_prompt, stats, data.execution_density_rating);
        logEvent('optimize_run', 'optimize', { archetype, mode, savings: stats.savings });
      }
    } catch (err) {
      if (requestId !== optimizationRequestId) return;

        toast(currentLanguage === 'ar' ? 'جلسة الدخول محتاجة تحديث. حدّث الصفحة وسجّل دخولك تاني؛ حسابك ما اتعملوش خروج.' : 'Your sign-in session needs refreshing. Reload and sign in again; you have not been signed out.');

        toast(currentLanguage === 'ar' ? 'الخدمة لسه ناقصها إعداد في Cloudflare. ابعت للمسؤول يراجع أسرار الـWorker.' : 'The Worker is missing a Cloudflare setting or secret.');

      } else if (String(err.message).includes('AI_PROVIDER_ERROR') || String(err.message).includes('API 502')) {
        toast(currentLanguage === 'ar' ? 'خدمة الذكاء الاصطناعي ماكملتش الطلب. جرّب تاني بعد شوية.' : 'The AI provider could not complete the request. Try again shortly.');
      } else if (String(err.message).includes('FREE_DAILY_LIMIT')) {
        toast(currentLanguage === 'ar' ? 'استهلكت استخدامك المجاني لليوم. هيتجدد بكرة.' : 'You used today’s free allowance. It resets tomorrow.');
      } else if (String(err.message).includes('APP_DAILY_LIMIT')) {
        toast(currentLanguage === 'ar' ? 'استخدام الأداة وصل للحد اليومي. جرّب تاني بعد التجديد.' : 'The app reached today’s shared free limit. Try again after reset.');
      } else if (String(err.message).includes('USAGE_ACCOUNTING')) {
        toast(currentLanguage === 'ar' ? 'الخدمة بتجهز عداد الاستخدام. جرّب بعد شوية.' : 'The usage meter is being configured. Try again shortly.');
      } else if (String(err.message).includes('RATE_LIMITED') || err.status === 429) {
        toast(currentLanguage === 'ar' ? 'طلبات كتير في وقت قصير. استنى دقيقة وجرب تاني.' : 'Too many requests in a short time. Wait a minute and try again.');
      } else if (String(err.message).includes('PROMPT_TOO_LONG')) {
        toast(currentLanguage === 'ar' ? 'البرومبت طويل زيادة. قلّله وجرب تاني.' : 'That prompt is too long. Shorten it and try again.');

  function wordDiff(a, b) {
    const aw = a.split(/(\s+)/), bw = b.split(/(\s+)/);
    // simple LCS
    const n = aw.length, m = bw.length;
    const dp = Array.from({length: n+1}, () => new Array(m+1).fill(0));
    for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) {
      dp[i][j] = aw[i] === bw[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
    }
    let i=0,j=0; const aOut=[], bOut=[];
    while (i<n && j<m) {
      if (aw[i] === bw[j]) { aOut.push({t:aw[i],keep:true}); bOut.push({t:bw[j],keep:true}); i++; j++; }
      else if (dp[i+1][j] >= dp[i][j+1]) { aOut.push({t:aw[i],keep:false}); i++; }
      else { bOut.push({t:bw[j],keep:false}); j++; }
    }
    while (i<n) { aOut.push({t:aw[i],keep:false}); i++; }
    while (j<m) { bOut.push({t:bw[j],keep:false}); j++; }
    return { aOut, bOut };
  }

  const FILLER_WORDS = /\b(please|kindly|just|really|very|actually|basically|simply|make sure|I want|I would like|could you|can you|thanks|thank you)\b/gi;

  function renderInspect() {
    if (!lastOriginal || !lastOptimized) {
      $('inspectEmpty').classList.remove('hidden');
      $('inspectContent').classList.add('hidden');
      return;
    }
    $('inspectEmpty').classList.add('hidden');
    $('inspectContent').classList.remove('hidden');

    const { aOut } = wordDiff(lastOriginal, lastOptimized);
    $('inspectBefore').innerHTML = aOut.map(w => w.keep
      ? `<span>${escapeHtml(w.t)}</span>`
      : (w.t.trim() ? `<span class="diff-del">${escapeHtml(w.t)}</span>` : escapeHtml(w.t))
    ).join('');
    $('inspectAfter').textContent = lastOptimized;

    const ot = estTokens(lastOriginal), pt = estTokens(lastOptimized);
    const ratio = pt > 0 ? Math.round((ot/pt)*100)/100 : ot;
    $('inspectRatio').textContent = ratio + 'x';
    $('inspectBeforeCount').textContent = formatTokenCount(ot);
    $('inspectAfterCount').textContent = formatTokenCount(pt);

    const fillerMatches = (lastOriginal.match(FILLER_WORDS) || []).length;
    const fillerTok = Math.min(ot - pt, Math.round(fillerMatches * 1.3));
    const remaining = Math.max(0, (ot - pt) - fillerTok);
    const structural = Math.round(remaining * 0.6);
    const semantic = remaining - structural;

    const attribution = [
      { label: 'Filler Stripping', desc: 'Politeness markers & empty phrases', tok: fillerTok, color: 'bg-red-100 text-red-600' },
      { label: 'Structural Shorthand', desc: 'Dense key-value / markdown mapping', tok: structural, color: 'bg-indigo-tint text-indigo' },
      { label: 'Semantic Deduplication', desc: 'Overlapping intent & context pruning', tok: semantic, color: 'bg-amber-tint text-amber-deep' },
    ].filter(a => a.tok > 0);

    $('attributionList').innerHTML = attribution.map(a => `
      <div class="flex items-start gap-3">

      </div>
    `).join('') || `<p class="text-sm text-ink-faint">No measurable pruning breakdown for this run.</p>`;
  }

  async function loadMetrics() {
    if (!supa) {
      $('metricTokens').textContent = '—';
      $('metricCost').textContent = '—';
      $('metricAvg').textContent = '—';
      $('metricRuns').textContent = '0';
      $('trendSvg').innerHTML = '';
      $('metricsEmptyNote').textContent = 'Connect Supabase in settings to see analytics.';
      $('metricsEmptyNote').classList.remove('hidden');
      return;
    }
    let rows = await fetchHistory();
    if (currentRange > 0) {
      const cutoff = Date.now() - currentRange * 86400000;
      rows = rows.filter(r => new Date(r.created_at).getTime() >= cutoff);
    }
    if (rows.length === 0) {
      $('metricTokens').textContent = '0';
      $('metricCost').textContent = '$0.00';
      $('metricAvg').textContent = '0%';
      $('metricRuns').textContent = '0';
      $('trendSvg').innerHTML = '';
      $('metricsEmptyNote').textContent = 'No runs yet in this range.';
      $('metricsEmptyNote').classList.remove('hidden');
      return;
    }
    $('metricsEmptyNote').classList.add('hidden');

    const totalSavedTok = rows.reduce((s,r) => s + (r.original_tokens||0) - (r.optimized_tokens||0), 0);
    const avgSavings = rows.reduce((s,r) => s + (r.savings_pct||0), 0) / rows.length;
    const costSaved = (totalSavedTok / 1000) * 0.002; // rough $/1K token estimate

    $('metricTokens').textContent = Math.abs(totalSavedTok) >= 1000
      ? (totalSavedTok/1000).toFixed(1)+'K'
      : totalSavedTok;
    $('metricCost').textContent = (costSaved < 0 ? '-$' : '$') + Math.abs(costSaved).toFixed(2);
    $('metricAvg').textContent = Math.round(avgSavings*10)/10 + '%';
    $('metricRuns').textContent = rows.length;

    const pts = rows.slice(-20).map(r => r.savings_pct || 0);
    const w = 320, h = 100, pad = 6;
    const max = Math.max(...pts, 10), min = Math.min(...pts, 0);
    const stepX = pts.length > 1 ? (w - pad*2) / (pts.length - 1) : 0;
    const y = (v) => h - pad - ((v - min) / (max - min || 1)) * (h - pad*2);
    const path = pts.map((v,i) => `${i===0?'M':'L'} ${pad + i*stepX} ${y(v)}`).join(' ');
    const area = path + ` L ${pad + (pts.length-1)*stepX} ${h-pad} L ${pad} ${h-pad} Z`;
    $('trendSvg').innerHTML = `
      <path d="${area}" fill="#EEF2FF" stroke="none"></path>
      <path d="${path}" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    `;
  }

    const path = values.map((value, index) => `${index === 0 ? 'M' : 'L'} ${pad + index * stepX} ${y(value)}`).join(' ');
    const area = `${path} L ${pad + (values.length - 1) * stepX} ${h - pad} L ${pad} ${h - pad} Z`;

      ? 'تطوير المنتج: اسأل المستخدمين اللي جرّبوا الأداة عن أكتر خطوة عطّلتهم، وحسّنها قبل زيادة الزيارات.'
      : 'Product: ask trial users what slowed them down and fix that before increasing traffic.');
    if (failureRate >= 0.05) actions.push(ar
      ? 'الكود والاعتمادية: نسبة الطلبات المتعثرة عالية؛ راجع أخطاء المزود والسجلات قبل أي حملة تسويق.'
      : 'Engineering: failed requests are elevated; review provider errors before a marketing push.');
    if (!actions.length) actions.push(ar
      ? 'المنتج: استمر في جمع رأي المستخدمين وراقب التحليلات أسبوعيًا. أقدر أساعدك في خطة التسويق أو قرارات المنتج أو الكود لما نراجع الأرقام.'
      : 'Product: keep collecting feedback and review these metrics weekly. I can help with marketing, product decisions, or implementation as we review the data.');
    $('adminNextActions').innerHTML = actions.map(action => `<p>• ${escapeHtml(action)}</p>`).join('');
  }

  async function saveAdminUsageSettings() {
    if (!supa || !isAdmin) return;
    const globalLimit = Math.floor(Number($('adminGlobalTokenLimit').value));
    const userLimit = Math.floor(Number($('adminUserTokenLimit').value));
    const activeLimit = Math.floor(Number($('readinessActiveLimit').value));
    const repeatLimit = Number($('readinessRepeatLimit').value);
    const weeklyLimit = Math.floor(Number($('readinessWeeklyLimit').value));
    if (![globalLimit, userLimit, activeLimit, weeklyLimit].every(value => Number.isFinite(value) && value > 0) ||
        !Number.isFinite(repeatLimit) || repeatLimit < 0 || repeatLimit > 100 || userLimit > globalLimit) {
      toast(currentLanguage === 'ar'
        ? 'راجع الحدود: كلها موجبة، وسقف الحساب مايبقاش أعلى من سقف التطبيق.'
        : 'Check the limits: use positive values and keep the per-account cap under the app cap.');
      return;
    }
    $('saveUsageLimitsBtn').disabled = true;
    try {
      const { error } = await supa.from('usage_settings').update({
        daily_global_token_limit: globalLimit,
        daily_user_token_limit: userLimit,
        readiness_active_users: activeLimit,
        readiness_repeat_rate: repeatLimit,
        readiness_weekly_users: weeklyLimit,
        updated_at: new Date().toISOString(),
      }).eq('id', true);
      if (error) throw error;
      $('usageLimitsSaved').textContent = currentLanguage === 'ar' ? 'اتحفظت الحدود ومؤشرات التنبيه.' : 'Limits and readiness signals saved.';
      $('usageLimitsSaved').classList.remove('hidden');
      await loadAdmin();
    } catch (error) {
      console.warn('admin usage settings update failed', error);
      toast(currentLanguage === 'ar' ? 'ماقدرناش نحفظ الإعدادات. اتأكد إنك شغّلت schema.sql.' : 'Could not save settings. Make sure schema.sql has been applied.');
    } finally {
      $('saveUsageLimitsBtn').disabled = false;
    }
  }

  $('saveUsageLimitsBtn').addEventListener('click', saveAdminUsageSettings);

  async function loadAdmin() {
    if (!supa || !isAdmin) return;
    try {
      const cutoff7Iso = new Date(Date.now() - 7 * 86400000).toISOString();
      const cutoff7 = Date.parse(cutoff7Iso);
      const [usersResult, runsResult, profilesResult, eventsResult, newUsersResult, usageResult] = await Promise.all([
        supa.from('profiles').select('*', { count: 'exact', head: true }),
        supa.from('prompts_history').select('*', { count: 'exact', head: true }),
        supa.from('profiles').select('email, created_at').order('created_at', { ascending: false }).limit(8),
        supa.from('analytics_events').select('event_type, view_name, created_at').gte('created_at', new Date(Date.now() - 14*86400000).toISOString()).limit(5000),
        supa.from('profiles').select('id', { count: 'exact', head: true }).gte('created_at', cutoff7Iso),
        supa.rpc('get_admin_usage_overview'),
      ]);
      if (usageResult.error) throw usageResult.error;
      const { count: totalUsers } = usersResult;
      const { count: totalRuns } = runsResult;
      const { data: profiles } = profilesResult;
      const { data: events7d } = eventsResult;
      const usage = usageResult.data || {};

      $('adminTotalUsers').textContent = totalUsers ?? '0';
      $('adminTotalRuns').textContent = totalRuns ?? '0';
      $('adminNewUsers').textContent = newUsersResult.count ?? '0';

      const pv7d = (events7d || []).filter(e => e.event_type === 'page_view' && new Date(e.created_at).getTime() >= cutoff7).length;
      $('adminPageviews7d').textContent = pv7d;

      const dailyUsed = Number(usage.daily_used || 0);
      const globalLimit = Number(usage.global_limit || 1);
      const usagePercent = Math.max(0, Math.min(100, Math.ceil((dailyUsed / globalLimit) * 100)));
      $('adminUsageToday').textContent = formatAdminTokens(dailyUsed);
      $('adminUsageRemaining').textContent = formatAdminTokens(Math.max(0, globalLimit - dailyUsed));
      $('adminUsageWeek').textContent = formatAdminTokens(usage.weekly_used || 0);
      $('adminUsageMonth').textContent = formatAdminTokens(usage.monthly_used || 0);
      $('adminUsageBar').style.width = usagePercent + '%';
      $('adminUsageFootnote').textContent = currentLanguage === 'ar'
        ? `${usagePercent}% من سقف التطبيق مستخدم النهارده. آخر 30 يوم: ${formatAdminTokens(usage.calls_30d || 0)} طلب، ${formatAdminTokens(usage.failed_30d || 0)} فشل، و${formatAdminTokens(usage.estimated_30d || 0)} قياس تقريبي.`
        : `${usagePercent}% of the app limit used today. Last 30 days: ${formatAdminTokens(usage.calls_30d || 0)} requests, ${formatAdminTokens(usage.failed_30d || 0)} failures, ${formatAdminTokens(usage.estimated_30d || 0)} estimated counts.`;
      $('adminGlobalTokenLimit').value = usage.global_limit || 100000;
      $('adminUserTokenLimit').value = usage.user_limit || 20000;
      $('readinessActiveLimit').value = usage.readiness_active_users || 50;
      $('readinessRepeatLimit').value = usage.readiness_repeat_rate ?? 25;
      $('readinessWeeklyLimit').value = usage.readiness_weekly_users || 20;
      const modes = usage.mode_totals || {};
      $('adminModeBreakdown').innerHTML = ['shorten', 'enhance'].map(modeName => {
        const item = modes[modeName] || { calls: 0, tokens: 0 };
        const label = currentLanguage === 'ar' ? (modeName === 'enhance' ? 'تحسين' : 'اختصار') : modeName;
        return `<p class="flex justify-between"><span>${label}</span><span>${formatAdminTokens(item.calls)} طلب · ${formatAdminTokens(item.tokens)} توكنز</span></p>`;
      }).join('');
      renderBusinessReadiness(usage);
      renderAdminUsageTrend(usage.daily_trend || {});

      // Daily page_view trend, last 14 days
      const days = Array.from({length:14}, (_,i) => {
        const d = new Date(Date.now() - (13-i)*86400000);
        return d.toISOString().slice(0,10);
      });
      const counts = Object.fromEntries(days.map(d => [d, 0]));
      (events7d || []).forEach(e => {
        if (e.event_type !== 'page_view') return;
        const day = e.created_at.slice(0,10);
        if (day in counts) counts[day]++;
      });
      const pts = days.map(d => counts[d]);
      if (pts.every(v => v === 0)) {
        $('adminTrendSvg').innerHTML = '';
        $('adminTrendEmpty').classList.remove('hidden');
      } else {
        $('adminTrendEmpty').classList.add('hidden');
        const w=320,h=100,pad=6;
        const max = Math.max(...pts, 1);
        const stepX = pts.length>1 ? (w-pad*2)/(pts.length-1) : 0;
        const y = v => h - pad - (v/max)*(h-pad*2);
        const path = pts.map((v,i)=>`${i===0?'M':'L'} ${pad+i*stepX} ${y(v)}`).join(' ');
        const area = path + ` L ${pad+(pts.length-1)*stepX} ${h-pad} L ${pad} ${h-pad} Z`;
        $('adminTrendSvg').innerHTML = `<path d="${area}" fill="#FEF3C7" stroke="none"></path><path d="${path}" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>`;
      }

      // Top viewed sections
      const viewCounts = {};
      (events7d || []).forEach(e => {
        if (e.event_type !== 'page_view' || !e.view_name) return;
        viewCounts[e.view_name] = (viewCounts[e.view_name] || 0) + 1;
      });
      const topViews = Object.entries(viewCounts).sort((a,b) => b[1]-a[1]).slice(0,6);
      $('adminTopViews').innerHTML = topViews.length ? topViews.map(([name,count]) => `
        <div class="flex items-center justify-between">
          <span class="font-mono text-xs text-ink-dim">${escapeHtml(translateLabel(({ optimize: 'Optimize', inspect: 'Inspect', metrics: 'Metrics', library: 'Library', admin: 'Admin' })[name] || name))}</span>
          <span class="font-semibold text-sm">${count}</span>
        </div>`).join('') : '<p class="text-ink-faint text-xs">لا توجد بيانات بعد.</p>';

      // Recent users
      $('adminRecentUsers').innerHTML = (profiles || []).length ? profiles.map(p => `
        <div class="flex items-center justify-between">
          <span class="font-mono text-xs text-ink-dim truncate max-w-[200px]">${escapeHtml(p.email || '—')}</span>
          <span class="text-[11px] text-ink-faint">${escapeHtml(new Date(p.created_at).toLocaleDateString(currentLocale()))}</span>
        </div>`).join('') : '<p class="text-ink-faint text-xs">لا يوجد مستخدمون بعد.</p>';
    } catch (e) {
      console.warn('admin load failed', e);
      toast('تعذر تحميل بيانات الأدمن');
    }
  }

  // Hook inspect render whenever we navigate there
  document.querySelector('[data-view="inspect"]').addEventListener('click', renderInspect);



  // ---------------- PWA: service worker + install prompt ----------------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    $('installBtn').classList.remove('hidden');
  });
  $('installBtn').addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    $('installBtn').classList.add('hidden');
  });
  window.addEventListener('appinstalled', () => toast('MiniMiz installed'));
})();
</script>
