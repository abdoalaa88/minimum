name: Security checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  worker-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --check worker.js
      - name: Check patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
      - name: Reject committed local secret files
        shell: bash
        run: |
          if [[ -e .env || -e .env.local || -e .dev.vars ]]; then
            echo "::error::Local secret files must not be committed."
            exit 1
          fi
